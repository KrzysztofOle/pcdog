# Isolated DHCP service for PcDog USB Ethernet hosts (ECM and RNDIS).
interface=usb0
bind-dynamic
except-interface=lo
port=0
no-resolv
dhcp-authoritative
dhcp-leasefile=/var/lib/pcdog/usb-dhcp.leases
dhcp-range=172.23.254.2,172.23.254.2,255.255.255.252,1h
# Send no Router option: the host receives no USB gateway/default route.
dhcp-option=option:router
